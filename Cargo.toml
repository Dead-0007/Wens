[workspace]
members = [
  "crates/core-rust",
  "crates/module-runtime",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.0.0"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[profile.release]
strip = "symbols"
lto = "thin"
opt-level = "s"
codegen-units = 1
