[package]
name = "wens-desktop"
version = "1.0.0"
description = "Wens offline-first desktop companion"
authors = ["Wens"]
edition = "2021"
license.workspace = true

[lib]
name = "wens_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
rusqlite.workspace = true
tauri-plugin-notification = "2"
wens-core = { path = "../crates/core-rust" }
wens-module-runtime = { path = "../crates/module-runtime" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1.53.3", features = ["macros", "net", "sync", "time"] }
url = "2.5.9"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
# desktop only: the crate has no Android/iOS implementation and fails to resolve
# `init`, `MacosLauncher` and `ManagerExt` when the target is a phone.
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_UI_Controls_Dialogs",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
